  <body>
    <div id="loading-placeholder-index" class="neptun-placeholder-logo">
      <img src="assets/images/neptun.svg" alt="Betöltés folyamatban">
      <div class="spinner-wrapper">
        <div class="spinner"></div>
        <p>Betöltés folyamatban</p>
      </div>
    </div>

    <!-- app-root intentionally left empty so NNPU's outage-card path fires -->
    <app-root></app-root>

    <script>
    // ─── Local preview bootstrap ───────────────────────────────────────────
    // Simulates the Angular bundle never loading (empty app-root) so the
    // NNPU outage card logic gets exercised. After 1 s the placeholder's
    // spinner is hidden and NNPU takes over the placeholder element.
    //
    // In the real userscript this is all handled by loginBanner.js +
    // GM.getValue/setValue; here we polyfill the GM API and run the same
    // visual code inline so the preview is self-contained.

    (function () {
      'use strict';

      // ── Tiny GM polyfill ──
      var GM_STORE = {};
      var GM = {
        info: { script: { version: '2.6.1' } },
        getValue: function (k) { return Promise.resolve(GM_STORE[k] || null); },
        setValue: function (k, v) { GM_STORE[k] = v; return Promise.resolve(); },
        deleteValue: function (k) { delete GM_STORE[k]; return Promise.resolve(); },
      };

      // ── School name from hostname ──
      var SCHOOL_MAP = [
        { re: /\bbme\b/i,     name: 'BME' },
        { re: /corvinus/i,    name: 'Corvinus' },
        { re: /szte\b/i,      name: 'SZTE' },
        { re: /\bpte\b/i,     name: 'PTE' },
        { re: /\belte\b/i,    name: 'ELTE' },
        { re: /\bde\b/i,      name: 'DE' },
        { re: /\bme\b/i,      name: 'ME' },
        { re: /\boe\b/i,      name: 'ÓE' },
        { re: /\bsoe\b/i,     name: 'SoE' },
        { re: /\bnke\b/i,     name: 'NKE' },
        { re: /\bke\b/i,      name: 'KE' },
        { re: /\bszie\b/i,    name: 'SZIE' },
        { re: /\bbgf\b/i,     name: 'BGF' },
        { re: /\bbge\b/i,     name: 'BGE' },
        { re: /obuda|óbuda/i, name: 'ÓE' },
        { re: /miskolc/i,     name: 'ME' },
        { re: /debrecen/i,    name: 'DE' },
        { re: /pecs|pécs/i,   name: 'PTE' },
      ];

      function resolveSchool() {
        var host = window.location.hostname;
        for (var i = 0; i < SCHOOL_MAP.length; i++) {
          if (SCHOOL_MAP[i].re.test(host)) return SCHOOL_MAP[i].name;
        }
        // Preview fallback – parse something friendly from the path/filename
        var parts = (window.location.pathname.split('/').pop() || 'preview').replace(/\.html?$/, '').split('-');
        return parts[0].toUpperCase() || 'az egyetem';
      }

      // ── Styles ──
      var STYLES = [
        '#nnpu-outage-card{width:min(92vw,600px);padding:20px 22px;border-radius:18px;',
        'background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(242,243,251,.95));',
        'border:1px solid rgba(9,67,217,.12);box-shadow:0 20px 50px rgba(33,48,85,.16);',
        'font-family:LatoWeb,"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;color:#213055}',
        '#nnpu-outage-card .nnpu-outage-pill{display:inline-flex;align-items:center;',
        'padding:5px 10px;border-radius:999px;background:linear-gradient(135deg,#16a34a,#0f766e);',
        'color:#fff;font-size:12px;font-weight:700;letter-spacing:.1px;margin-bottom:12px}',
        '#nnpu-outage-card h2{margin:0 0 8px;font-size:22px;font-weight:900;line-height:1.15}',
        '#nnpu-outage-card .nnpu-outage-sub{margin:0 0 14px;font-size:14px;line-height:1.5;color:#425173}',
        '#nnpu-outage-card .nnpu-outage-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}',
        '#nnpu-outage-card .nnpu-btn{height:40px;padding:0 16px;border:0;border-radius:10px;',
        'font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s}',
        '#nnpu-outage-card .nnpu-btn:hover{opacity:.85}',
        '#nnpu-outage-card .nnpu-btn-primary{background:#0943d9;color:#fff}',
        '#nnpu-outage-card .nnpu-btn-toggle{background:#eef3ff;color:#213055}',
        '#nnpu-outage-card .nnpu-btn-toggle.active{background:#16a34a;color:#fff}',
        '#nnpu-outage-card .nnpu-refresh-countdown{font-size:13px;color:#6a7892}',
        '#nnpu-outage-card .nnpu-game-wrap{margin-top:2px;border-top:1px solid rgba(9,67,217,.08);padding-top:14px}',
        '#nnpu-outage-card .nnpu-game-label{font-size:12px;font-weight:700;color:#8892aa;',
        'text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}',
        '#nnpu-snake-canvas{display:block;width:100%;max-width:300px;border-radius:10px;',
        'border:1px solid rgba(9,67,217,.12);background:#f2f3fb;cursor:pointer;image-rendering:pixelated}',
        '#nnpu-outage-card .nnpu-game-hint{margin-top:6px;font-size:12px;color:#8892aa}',
        '#loading-placeholder-index.nnpu-outage-mode{gap:24px;padding:24px;',
        'background:radial-gradient(circle at top left,rgba(9,67,217,.08),transparent 34%),',
        'radial-gradient(circle at bottom right,rgba(15,118,110,.08),transparent 34%),#fff}'
      ].join('');

      var styleEl = document.createElement('style');
      styleEl.textContent = STYLES;
      document.head.appendChild(styleEl);

      // ── Auto-refresh helpers ──
      var REFRESH_INTERVAL = 10;
      var AUTOREFRESH_KEY = 'nnpu-outage-autorefresh';
      var refreshTimer = null;
      var refreshCountdown = 0;

      function clearAutoRefresh(countdownEl) {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        refreshCountdown = 0;
        if (countdownEl) countdownEl.textContent = '';
      }

      function startAutoRefresh(countdownEl) {
        clearAutoRefresh(countdownEl);
        refreshCountdown = REFRESH_INTERVAL;
        if (countdownEl) countdownEl.textContent = '(' + refreshCountdown + 's)';
        refreshTimer = setInterval(function () {
          refreshCountdown -= 1;
          if (countdownEl) countdownEl.textContent = '(' + refreshCountdown + 's)';
          if (refreshCountdown <= 0) window.location.reload();
        }, 1000);
      }

      // ── Snake game ──
      function mountSnake(container) {
        var COLS = 20, ROWS = 14, CELL = 14;
        var W = COLS * CELL, H = ROWS * CELL;
        var canvas = document.createElement('canvas');
        canvas.id = 'nnpu-snake-canvas';
        canvas.width = W; canvas.height = H;
        canvas.title = 'Kattints a játékhoz!';
        canvas.setAttribute('tabindex', '0');
        container.appendChild(canvas);
        var hint = document.createElement('p');
        hint.className = 'nnpu-game-hint';
        hint.textContent = 'Kattints vagy nyomj Space-t az indításhoz · nyilak / WASD';
        container.appendChild(hint);

        var ctx = canvas.getContext('2d');
        var snake, dir, nextDir, food, score, running, animFrame, lastTime;

        function rnd(n) { return Math.floor(Math.random() * n); }
        function randFood() {
          var pos;
          do { pos = { x: rnd(COLS), y: rnd(ROWS) }; }
          while (snake.some(function (s) { return s.x === pos.x && s.y === pos.y; }));
          return pos;
        }

        function drawOver(msg) {
          ctx.fillStyle = 'rgba(33,48,85,.62)'; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
          ctx.font = 'bold 16px LatoWeb,sans-serif'; ctx.fillText(msg, W / 2, H / 2 - 8);
          ctx.font = '12px LatoWeb,sans-serif'; ctx.fillText('Kattints az újrakezdéshez', W / 2, H / 2 + 14);
          ctx.textAlign = 'left';
        }

        function draw() {
          ctx.fillStyle = '#f2f3fb'; ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 1, 0, Math.PI * 2); ctx.fill();
          snake.forEach(function (seg, i) {
            ctx.fillStyle = i === 0 ? '#16a34a' : '#0943d9';
            var r = i === 0 ? 4 : 2;
            ctx.beginPath(); ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, r); ctx.fill();
          });
          ctx.fillStyle = '#213055'; ctx.font = 'bold 11px LatoWeb,sans-serif';
          ctx.fillText(score + ' pont', 6, 14);
        }

        function step() {
          dir = nextDir;
          var head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };
          if (snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
            running = false; draw(); drawOver('Vége! ' + score + ' pont');
            hint.textContent = 'Kattints az újrakezdéshez'; return;
          }
          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) { score += 1; food = randFood(); } else { snake.pop(); }
          draw();
        }

        function loop(ts) {
          if (!running) return;
          animFrame = requestAnimationFrame(loop);
          if (!ts || ts - lastTime >= 140) { lastTime = ts || 0; step(); }
        }

        function init() {
          snake = [{ x: 10, y: 7 }, { x: 9, y: 7 }, { x: 8, y: 7 }];
          dir = nextDir = { x: 1, y: 0 }; food = randFood(); score = 0;
          running = true; lastTime = 0;
          hint.textContent = 'Nyilak / WASD az irányításhoz';
          loop();
        }

        function handleKey(e) {
          if (!running) return;
          var map = {
            ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 },
            ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 },
            ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 },
            ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 },
          };
          var nd = map[e.key]; if (!nd || (nd.x === -dir.x && nd.y === -dir.y)) return;
          nextDir = nd; e.preventDefault();
        }

        ctx.fillStyle = '#f2f3fb'; ctx.fillRect(0, 0, W, H); drawOver('🐍 Kattints az indításhoz');

        canvas.addEventListener('click', function () { if (animFrame) cancelAnimationFrame(animFrame); init(); });
        document.addEventListener('keydown', function (e) {
          if (e.key === ' ' && !running) { if (animFrame) cancelAnimationFrame(animFrame); init(); }
          else handleKey(e);
        });
      }

      // ── Build outage card ──
      function buildOutageCard(autoOn, countdownEl) {
        var school = resolveSchool();
        var card = document.createElement('section');
        card.id = 'nnpu-outage-card';

        var pill = document.createElement('div');
        pill.className = 'nnpu-outage-pill';
        pill.textContent = '⚡ NNPU v' + GM.info.script.version + ' Aktív';
        card.appendChild(pill);

        var h2 = document.createElement('h2');
        h2.textContent = 'A login oldal most legalább stílusosan áll. 🥔';
        card.appendChild(h2);

        var sub = document.createElement('p');
        sub.className = 'nnpu-outage-sub';
        sub.textContent = 'Úgy tűnik, a ' + school + ' szerverei épp valami fontosabb dologgal foglalkoznak – például léteznek. Az Angular bundle-ök nem álltak fel. ¯\\_(ツ)_/¯';
        card.appendChild(sub);

        var actRow = document.createElement('div');
        actRow.className = 'nnpu-outage-actions';

        var retryBtn = document.createElement('button');
        retryBtn.className = 'nnpu-btn nnpu-btn-primary';
        retryBtn.textContent = '🔄 Újrapróbálás';
        retryBtn.addEventListener('click', function () { window.location.reload(); });
        actRow.appendChild(retryBtn);

        var toggleBtn = document.createElement('button');
        toggleBtn.className = 'nnpu-btn nnpu-btn-toggle' + (autoOn ? ' active' : '');
        toggleBtn.textContent = autoOn ? '⏱ Auto-frissítés: BE' : '⏱ Auto-frissítés: KI';
        actRow.appendChild(toggleBtn);

        var cdSpan = document.createElement('span');
        cdSpan.className = 'nnpu-refresh-countdown';
        actRow.appendChild(cdSpan);
        card.appendChild(actRow);

        toggleBtn.addEventListener('click', function () {
          autoOn = !autoOn;
          GM.setValue(AUTOREFRESH_KEY, autoOn ? '1' : '0');
          if (autoOn) {
            toggleBtn.classList.add('active');
            toggleBtn.textContent = '⏱ Auto-frissítés: BE';
            startAutoRefresh(cdSpan);
          } else {
            toggleBtn.classList.remove('active');
            toggleBtn.textContent = '⏱ Auto-frissítés: KI';
            clearAutoRefresh(cdSpan);
          }
        });

        if (autoOn) startAutoRefresh(cdSpan);

        var gameWrap = document.createElement('div');
        gameWrap.className = 'nnpu-game-wrap';
        var gameLabel = document.createElement('div');
        gameLabel.className = 'nnpu-game-label';
        gameLabel.textContent = '🐍 Míg vársz – kígyó';
        gameWrap.appendChild(gameLabel);
        mountSnake(gameWrap);
        card.appendChild(gameWrap);

        return card;
      }

      // ── Main: after 1 s, swap placeholder → outage card (Angular never loads) ──
      window.setTimeout(function () {
        var placeholder = document.getElementById('loading-placeholder-index');
        if (!placeholder) return;
        // Clear the spinner children
        while (placeholder.firstChild) placeholder.removeChild(placeholder.firstChild);
        placeholder.classList.add('nnpu-outage-mode');

        GM.getValue(AUTOREFRESH_KEY).then(function (val) {
          var autoOn = val === '1';
          placeholder.appendChild(buildOutageCard(autoOn, null));
        });
      }, 1000);

    })();
    </script>
</body>
</html>
